appId: ru.tunequeue.desktop
productName: TuneQueue
directories:
  output: release
  buildResources: assets
files:
  - build/**/*
  - assets/icon.png
win:
  icon: assets/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
artifactName: TuneQueue-${version}-${os}.${ext}
